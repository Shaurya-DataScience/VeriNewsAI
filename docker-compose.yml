version: '3.8'

services:
  verinews-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verinews_ai_app
    ports:
      - "8000:8000"
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY:-tvly-dev-demo-key}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - VERINEWS_DB_PATH=/app/backend/data/verinews_cache.db
      - ENVIRONMENT=production
    volumes:
      - sqlite_data:/app/backend/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sqlite_data:
