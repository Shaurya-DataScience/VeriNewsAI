name: VeriNews AI CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================================
  # 1. Backend Python Testing
  # ==========================================================
  backend-tests:
    name: Backend PyTest Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run PyTest Test Suite
        env:
          TAVILY_API_KEY: "mock_ci_key"
        run: |
          python -m pytest backend/tests/ -v --maxfail=5

  # ==========================================================
  # 2. Frontend Code Quality & Integrity Checks
  # ==========================================================
  frontend-audit:
    name: Frontend Assets & Syntax Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Critical Frontend Assets
        run: |
          test -f frontend/index.html || exit 1
          test -f frontend/style.css || exit 1
          test -f frontend/script.js || exit 1
          test -f frontend/assets/og-preview.png || exit 1
          echo "All core static assets verified."

      - name: Validate JavaScript Syntax
        run: |
          node -c frontend/script.js
          echo "JavaScript syntax check passed with 0 errors."

  # ==========================================================
  # 3. Docker Container Build Verification
  # ==========================================================
  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-audit]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: verinews-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
